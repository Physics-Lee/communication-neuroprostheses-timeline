# ============================================================================
# Living Timeline of Communication Neuroprostheses for People with Paralysis
# Repository: communication-neuroprostheses-timeline
# ============================================================================
# Weekly-updated dataset driving `communication_neuroprostheses_timeline.{png,pdf}`.
#
# Visual encoding (6 dimensions per study card):
#   1. data_availability : open | on_request | closed | preprint | reanalysis
#   2. decoding_mode     : online (closed-loop participant demo) | offline (reanalysis / offline-only)
#   3. electrode         : ecog (circle) | utah (square) | thin_film (hexagon) | microwire (down-triangle)
#   4. participants      : suffix ▲ = can speak naturally; △ = vocal paralysis (dysarthria / anarthria / LIS)
#   5. task_instruction  : inner (◆) | intended (◇, overt / mouthing / intended) | both (◆/◇)
#   6. decoded_output    : voice (⬟, direct neural-to-voice synthesis) | text (⬠, brain-to-text) | both (⬟/⬠)
#
# Structured 4-item `metrics` schema per study:
#   - vocab_size : Vocabulary size (e.g. "vocab 125k", "open vocab", "vocab 50", "vocab n/r")
#   - sentences  : Sentence / trial count (training + evaluation data volume)
#   - wer        : Word / character / phoneme / listener error rate
#   - speed      : Communication rate (wpm / cpm, or "n/r" if not reported / offline)
# ============================================================================

