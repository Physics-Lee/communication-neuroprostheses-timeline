name: Weekly Living Timeline Patrol & Render

on:
  schedule:
    # Runs every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  push:
    branches: [main]
    paths:
      - "studies.yaml"
      - "render_timeline.py"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Lookback window in days for literature patrol"
        required: false
        default: "7"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  render-and-patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system DejaVu fonts & Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render timeline & verify zero bounding-box overlaps
        run: |
          python render_timeline.py --yaml studies.yaml --out communication_neuroprostheses_timeline --check-overlaps

      - name: Commit updated timeline figures & synced JSON if studies.yaml changed
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- communication_neuroprostheses_timeline.png communication_neuroprostheses_timeline.pdf studies.json; then
            git add communication_neuroprostheses_timeline.png communication_neuroprostheses_timeline.pdf studies.json
            git commit -m "auto: re-render communication_neuroprostheses_timeline.{png,pdf} and sync studies.json"
            git push
          fi

      - name: Run weekly PubMed / bioRxiv / medRxiv / arXiv / Crossref patrol
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          DAYS="${{ github.event.inputs.lookback_days || '7' }}"
          python weekly_patrol.py --days "$DAYS" --output weekly_candidates.md

      - name: Upload weekly patrol report artifact
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-patrol-report
          path: weekly_candidates.md
